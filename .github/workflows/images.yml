# Campus Köthen — build, scan and publish release images
#
# Called by CI only after every verification job passed. A manual dispatch is
# available for an explicit rebuild, but this workflow never deploys or reaches
# a server.

name: Images

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: apps/backend/Dockerfile
            image: ghcr.io/leviora-studio/campus-koethen/backend
          - component: cms
            dockerfile: apps/cms/Dockerfile
            image: ghcr.io/leviora-studio/campus-koethen/cms

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=campus-koethen-${{ matrix.component }}
            org.opencontainers.image.description=Campus Köthen — independent, unofficial campus app
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Build into the runner first. A vulnerable image must not be published
      # even briefly under an otherwise valid immutable tag.
      - name: Build image for security scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: local/campus-koethen-${{ matrix.component }}:scan-${{ github.sha }}
          cache-to: type=local,dest=/tmp/buildx-cache-${{ matrix.component }},mode=max

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/campus-koethen-${{ matrix.component }}:scan-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          timeout: 10m

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the scanned build cache. The registry output can carry the SBOM
      # and max-level provenance that Docker's local image store cannot retain.
      - name: Publish verified image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=local,src=/tmp/buildx-cache-${{ matrix.component }}
          provenance: mode=max
          sbom: true
