# Shared Nginx capacity contract for the Campus Koethen test deployment.
#
# Install this file in /etc/nginx/conf.d/ together with the two final virtual
# hosts. It is intentionally separate from the server blocks: rate-limit and
# connection-limit zones, upstream keepalive pools and proxy caches are valid
# only in the surrounding http{} context.

# The expected audience is 3,000 students. Many of them can share one public
# campus NAT address, so the per-address limits are deliberately only an
# extreme-abuse guard. The global zones protect the single API process and
# smooth short synchronized bursts across all source addresses.
limit_req_zone $binary_remote_addr zone=campus_api_per_nat:20m rate=1200r/s;
limit_req_zone $server_name zone=campus_api_global:1m rate=600r/s;

limit_req_zone $binary_remote_addr zone=campus_media_per_nat:20m rate=120r/s;
limit_req_zone $server_name zone=campus_media_global:1m rate=60r/s;

limit_req_zone $binary_remote_addr zone=campus_docs_per_nat:10m rate=100r/s;
limit_req_zone $server_name zone=campus_docs_global:1m rate=50r/s;

limit_req_zone $binary_remote_addr zone=campus_health_per_nat:10m rate=20r/s;
limit_req_zone $server_name zone=campus_health_global:1m rate=50r/s;

limit_req_zone $binary_remote_addr zone=campus_cms_per_nat:10m rate=100r/s;
limit_req_zone $server_name zone=campus_cms_global:1m rate=200r/s;

limit_conn_zone $binary_remote_addr zone=campus_conn_per_nat:20m;
limit_conn_zone $server_name zone=campus_conn_global:1m;
limit_conn_zone $server_name zone=campus_cms_conn_global:1m;

# Reuse loopback connections instead of opening a new TCP connection for every
# proxied request. The explicit HTTP/1.1 and cleared Connection header in the
# virtual hosts keep this compatible with the Nginx versions shipped by current
# Debian and Ubuntu releases.
upstream campus_api_backend {
    server 127.0.0.1:3021;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream campus_cms_backend {
    server 127.0.0.1:3020;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Editorial filenames change when an image is replaced. Caching these public
# API responses at the edge therefore removes repeated 12 MiB-capable fetches
# through Node and Strapi without making editorial updates stale.
proxy_cache_path /var/cache/nginx/campus-media
    levels=1:2
    keys_zone=campus_media_cache:32m
    max_size=5g
    inactive=7d
    use_temp_path=off;
