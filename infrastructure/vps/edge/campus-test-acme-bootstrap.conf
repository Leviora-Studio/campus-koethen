# Temporary HTTP-only virtual host for the first Let's Encrypt certificate.
#
# Install this file first, obtain the certificate exactly as documented in
# ./README.md, then remove this file and install the two final virtual hosts.
# Do not leave it enabled alongside the final files: they define the same
# port-80 server names.

server {
    listen 80;
    server_name campus-test-api.erikspace.eu campus-test-cms.erikspace.eu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
