# Campus Köthen — reference edge configuration for the public Campus API.
#
# NOT deployed from this repository. Deployment is deliberately manual (see
# ../README.md): there is no SSH step, no server secret and no environment
# promotion anywhere in this checkout. This file is the versioned CONTRACT for
# what the edge is expected to do, so a change there is visible here.
#
# Read ./README.md first — it states the promises this file implements and,
# just as importantly, what it deliberately leaves out (TLS, server names,
# domains).
#
# Adapt the two placeholders before use:
#   <API_HOST_PORT>   loopback port from .env (API_HOST_PORT, default 3021)
#   <PUBLIC_HOSTNAME> the public name; still an open release gate (AGENTS.md §10)

# --- Shared zones. Must live in the http{} block, not inside a server{}. -----
#
# 10m holds roughly 160k addresses — far more than this audience, and the point
# is that the zone never fills and starts evicting silently.

# General traffic. The app's own usage is bursty-but-small: opening a screen
# fires a handful of requests, then goes quiet.
limit_req_zone $binary_remote_addr zone=campus_api:10m rate=10r/s;

# The media path is the expensive one — up to 12 MB per request pulled through
# the API process from Strapi. It gets its own, much tighter budget.
limit_req_zone $binary_remote_addr zone=campus_media:10m rate=2r/s;

# The documentation page: HTML plus assets, and nothing an app polls. Modest
# on purpose — generous enough for a human reading it, not for a crawler.
limit_req_zone $binary_remote_addr zone=campus_docs:10m rate=5r/s;

# A rate limit alone does not see a client that opens many connections and
# reads each one slowly.
limit_conn_zone $binary_remote_addr zone=campus_conn:10m;

# Honest 429 instead of a 503 that reads like "the server is broken".
limit_req_status 429;
limit_conn_status 429;

server {
    # listen / server_name / TLS belong to the host installation and are
    # deliberately not fixed here.

    # The API is READ-ONLY. No endpoint accepts a body, so anything larger than
    # a stray header is refused before it is read.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # The upstream announces nothing about itself; neither should this hop.
    server_tokens off;

    # Default deny. A path that is not listed below does not exist from
    # outside.
    location / {
        return 404;
    }

    location /v1/ {
        limit_req zone=campus_api burst=20 nodelay;
        limit_conn campus_conn 20;

        # The API answers GET only; rejecting the rest here keeps it out of the
        # Node process entirely.
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:<API_HOST_PORT>;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Above the API's own Strapi timeout (10s) plus its bounded retries, so
        # a slow-but-working upstream is not cut off — and well below a
        # connection that has simply hung.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # The API sets its own security headers on every response, including
        # the bytes the media endpoint sends. Nothing is added or overridden
        # here — two sources for the same header is how they drift apart.
    }

    # Tighter budget for the one path that moves real bytes.
    location /v1/media/ {
        limit_req zone=campus_media burst=10 nodelay;
        limit_conn campus_conn 10;

        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:<API_HOST_PORT>;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Probes: reachable, unlogged, and not worth rate limiting into uselessness.
    location = /health/live {
        access_log off;
        proxy_pass http://127.0.0.1:<API_HOST_PORT>;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /health/ready {
        access_log off;
        limit_req zone=campus_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:<API_HOST_PORT>;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Swagger UI and the OpenAPI document.
    #
    # Public by deliberate decision (Erik, LEVIORA-180): the API is a public
    # read-only contract, so the page documenting it belongs in the open. The
    # backend must have DOCS_ENABLED=true for this to answer at all — the edge
    # only decides whether the path is reachable, not whether it exists.
    #
    # The prefix match is required, not cosmetic: Swagger UI loads its own
    # bundle and stylesheet from under /docs/.
    #
    # Its own rate-limit budget because it is HTML plus assets rather than a
    # JSON answer, and because a documentation page has no reason to be hit at
    # app frequency.
    location /docs {
        limit_req zone=campus_docs burst=15 nodelay;
        limit_conn campus_conn 10;

        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:<API_HOST_PORT>;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
