# Campus Köthen test CMS — deployable Nginx virtual host.
#
# Install as:
#   /etc/nginx/conf.d/campus-test-cms.erikspace.eu.conf
#
# Prerequisite: the shared certificate described in ./README.md exists at
# /etc/letsencrypt/live/campus-koethen-test/. The upstream port matches
# CMS_HOST_PORT in ../campus-test-api.example. Strapi provides its own admin
# authentication, so this virtual host deliberately adds no HTTP Basic Auth.

server {
    listen 80;
    server_name campus-test-cms.erikspace.eu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name campus-test-cms.erikspace.eu;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level notice;

    ssl_certificate /etc/letsencrypt/live/campus-koethen-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-koethen-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;

    error_page 429 = @campus_rate_limited;
    location @campus_rate_limited {
        add_header Retry-After 2 always;
        return 429;
    }

    # Strapi accepts files up to 25 MiB in this environment. Allow a small
    # multipart overhead at the edge while keeping an explicit upper bound.
    client_max_body_size 30m;
    client_body_timeout 120s;
    client_header_timeout 10s;

    location / {
        # Strapi Admin has its own authentication. These generous limits are a
        # last-resort abuse ceiling, not a restriction for normal editors.
        limit_req zone=campus_cms_per_nat burst=500 nodelay;
        limit_req zone=campus_cms_global burst=1000 delay=200;
        limit_conn campus_conn_per_nat 500;
        limit_conn campus_cms_conn_global 750;

        proxy_pass http://campus_cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
