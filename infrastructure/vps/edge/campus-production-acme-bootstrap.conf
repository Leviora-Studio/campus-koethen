# Temporary HTTP-only virtual host for the first production Let's Encrypt
# certificate.
#
# Install this file first, obtain the certificate exactly as documented in
# ./README.md, then remove this file and install the two final production
# virtual hosts. Do not leave it enabled alongside the final files: they define
# the same port-80 server names.

server {
    listen 80;
    server_name campus-koethen-api.sturahsa.de koethen-cms.sturahsa.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
